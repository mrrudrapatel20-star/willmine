<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Italiana&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4ecf0;
    --sky-deep:#150a24;
    --sky-mid:#2b1440;
    --sky-warm:#4a1f4e;
    --gold:#e7bf7c;
    --gold-soft:#f0d9a8;
    --rose:#e7a7bb;
    --rose-deep:#c7708f;
    --card-bg: rgba(20, 10, 32, 0.55);
    --line: rgba(231,191,124,0.35);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% -10%, var(--sky-warm), var(--sky-mid) 45%, var(--sky-deep) 100%);
    overflow:hidden;
    font-family: 'Cormorant Garamond', serif;
    color: var(--ink);
  }

  #stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- stars ---------- */
  .star{
    position:absolute;
    background: var(--gold-soft);
    border-radius:50%;
    opacity:0.7;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(0.8); }
    50%{ opacity:0.9; transform:scale(1.15); }
  }

  /* ---------- moon ---------- */
  .moon{
    position:absolute;
    top:8%; right:10%;
    width:90px; height:90px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #fff7e6, var(--gold-soft) 60%, var(--gold) 100%);
    box-shadow: 0 0 60px 12px rgba(231,191,124,0.35);
  }

  /* ---------- floating hearts ambience ---------- */
  .drift-heart{
    position:absolute;
    bottom:-40px;
    color: var(--rose);
    opacity:0.35;
    font-size:18px;
    animation-name: rise;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    pointer-events:none;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.4; }
    90%{ opacity:0.25; }
    100%{ transform: translateY(-110vh) translateX(var(--drift, 20px)) rotate(20deg); opacity:0; }
  }

  /* ---------- card ---------- */
  #card{
    position:relative;
    z-index:5;
    width:min(90vw, 480px);
    padding: 56px 40px 44px;
    text-align:center;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 0 1px rgba(231,191,124,0.08), 0 30px 80px rgba(0,0,0,0.55);
    transition: opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
  }

  #card.fading{
    opacity:0;
    transform: scale(0.94);
    filter: blur(6px);
    pointer-events:none;
  }

  .ornament{
    font-family:'Italiana', serif;
    font-size:11px;
    letter-spacing: 0.35em;
    color: var(--gold);
    opacity:0.8;
    margin-bottom: 18px;
  }

  h1{
    font-family:'Parisienne', cursive;
    font-weight:400;
    font-size: clamp(34px, 7vw, 50px);
    line-height:1.25;
    margin: 0 0 10px;
    color: var(--gold-soft);
    text-shadow: 0 2px 20px rgba(231,191,124,0.25);
  }

  p.sub{
    font-size: 19px;
    font-style: italic;
    color: rgba(244,236,240,0.8);
    margin: 0 0 34px;
    line-height:1.5;
  }

  .divider{
    width:56px; height:1px;
    background: var(--line);
    margin: 0 auto 30px;
  }

  .buttons{
    position:relative;
    display:flex;
    gap:22px;
    justify-content:center;
    align-items:center;
    min-height: 60px;
  }

  button{
    font-family:'Cormorant Garamond', serif;
    font-size: 18px;
    letter-spacing: 0.04em;
    padding: 14px 30px;
    border-radius: 2px;
    cursor:pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  #yes{
    background: linear-gradient(160deg, var(--gold-soft), var(--gold));
    color: #2b1440;
    border: 1px solid var(--gold);
    font-weight:600;
  }
  #yes:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 26px rgba(231,191,124,0.35);
  }

  #no{
    background: transparent;
    color: var(--rose);
    border: 1px solid rgba(231,167,187,0.5);
    position: fixed;
  }
  #no.settled{
    position: static;
  }

  #dodge-caption{
    position:absolute;
    bottom:-30px; left:0; right:0;
    font-size:13px;
    font-style:italic;
    color: rgba(244,236,240,0.55);
    opacity:0;
    transition: opacity 0.4s ease;
  }
  #dodge-caption.show{ opacity:1; }

  /* ---------- reveal ---------- */
  #reveal{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity 1s ease;
    z-index:10;
  }
  #reveal.show{ opacity:1; pointer-events:auto; }

  #reveal .line{
    font-family:'Parisienne', cursive;
    font-size: clamp(46px, 11vw, 100px);
    color: var(--gold-soft);
    text-shadow: 0 0 40px rgba(231,191,124,0.5);
    display:flex;
  }
  #reveal .line span{
    opacity:0;
    transform: translateY(18px);
    animation: letterIn 0.6s forwards;
  }
  @keyframes letterIn{
    to{ opacity:1; transform:translateY(0); }
  }

  #reveal .after{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 19px;
    color: rgba(244,236,240,0.75);
    margin-top: 20px;
    opacity:0;
    animation: fadeInUp 1s forwards;
    animation-delay: 1.6s;
  }
  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .burst-heart{
    position:fixed;
    top:50%; left:50%;
    font-size: 20px;
    color: var(--rose);
    pointer-events:none;
    z-index:9;
    animation: burst 1.8s ease-out forwards;
  }
  @keyframes burst{
    to{
      transform: translate(var(--bx), var(--by)) scale(var(--bs));
      opacity:0;
    }
  }
</style>
</head>
<body>

<div id="stage">
  <div class="moon"></div>

  <div id="card">
    <div class="ornament">A QUESTION, UNDER THIS SKY</div>
    <h1>Will you be mine?</h1>
    <p class="sub">Not today's date, not a plan for the weekend —<br>just this, asked plainly, under the stars.</p>
    <div class="divider"></div>
    <div class="buttons">
      <button id="yes">Yes, I will</button>
      <button id="no">No</button>
      <div id="dodge-caption"></div>
    </div>
  </div>

  <div id="reveal">
    <div class="line" id="revealLine"></div>
    <div class="after">and I am so glad you said it.</div>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');

  // starfield
  for(let i=0;i<70;i++){
    const s=document.createElement('div');
    s.className='star';
    const size = Math.random()*2.4+1;
    s.style.width=size+'px';
    s.style.height=size+'px';
    s.style.top=Math.random()*70+'%';
    s.style.left=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*3.5)+'s';
    stage.appendChild(s);
  }

  // drifting ambient hearts
  const heartChars=['♡','❤'];
  for(let i=0;i<14;i++){
    const h=document.createElement('div');
    h.className='drift-heart';
    h.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
    h.style.left = Math.random()*100+'%';
    h.style.fontSize = (14+Math.random()*14)+'px';
    h.style.setProperty('--drift', (Math.random()*80-40)+'px');
    h.style.animationDuration = (9+Math.random()*8)+'s';
    h.style.animationDelay = (Math.random()*10)+'s';
    stage.appendChild(h);
  }

  // ---- reject button always escapes ----
  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  const caption = document.getElementById('dodge-caption');
  const card = document.getElementById('card');

  const excuses = [
    "hm, that button seems to be on a break",
    "it moved. sorry, not sorry.",
    "try as you might — it's shy",
    "that answer doesn't quite fit here",
    "nice attempt though"
  ];
  let excuseIndex = 0;

  function settleIntoFlow(){
    // remove fixed positioning styling once user starts interacting, so layout doesn't jump oddly on first load
    noBtn.classList.add('settled');
    noBtn.style.position='fixed';
  }

  function dodge(e){
    const rect = card.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();
    const w = btnRect.width, h = btnRect.height;
    const margin = 16;
    let x, y, tries=0;
    do{
      x = margin + Math.random()*(window.innerWidth - w - margin*2);
      y = margin + Math.random()*(window.innerHeight - h - margin*2);
      tries++;
    } while(
      tries < 8 &&
      x < rect.right+20 && x+w > rect.left-20 &&
      y < rect.bottom+20 && y+h > rect.top-20
    );
    noBtn.style.left = x+'px';
    noBtn.style.top = y+'px';

    caption.textContent = excuses[excuseIndex % excuses.length];
    excuseIndex++;
    caption.classList.add('show');
    clearTimeout(caption._t);
    caption._t = setTimeout(()=>caption.classList.remove('show'), 1600);
  }

  // place it initially near its natural spot
  window.addEventListener('load', ()=>{
    const btnRect = noBtn.getBoundingClientRect();
    noBtn.style.left = btnRect.left+'px';
    noBtn.style.top = btnRect.top+'px';
  });

  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('touchstart', function(e){
    e.preventDefault();
    dodge(e);
  }, {passive:false});
  noBtn.addEventListener('click', function(e){
    e.preventDefault();
    dodge(e);
  });

  // ---- accept flow ----
  function spawnBurst(){
    const chars=['❤','♡','✦'];
    for(let i=0;i<28;i++){
      const b=document.createElement('div');
      b.className='burst-heart';
      b.textContent = chars[Math.floor(Math.random()*chars.length)];
      const angle = Math.random()*Math.PI*2;
      const dist = 120 + Math.random()*260;
      b.style.setProperty('--bx', Math.cos(angle)*dist+'px');
      b.style.setProperty('--by', Math.sin(angle)*dist+'px');
      b.style.setProperty('--bs', (0.6+Math.random()*0.9));
      b.style.animationDelay = (Math.random()*0.3)+'s';
      document.body.appendChild(b);
      setTimeout(()=>b.remove(), 2200);
    }
  }

  yesBtn.addEventListener('click', ()=>{
    card.classList.add('fading');
    spawnBurst();

    setTimeout(()=>{
      const line = document.getElementById('revealLine');
      const text = "I love you";
      line.innerHTML='';
      [...text].forEach((ch,i)=>{
        const span=document.createElement('span');
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        span.style.animationDelay = (i*0.09)+'s';
        line.appendChild(span);
      });
      document.getElementById('reveal').classList.add('show');
      // gentle secondary burst
      setTimeout(spawnBurst, 400);
    }, 500);
  });
</script>

</body>
</html>
